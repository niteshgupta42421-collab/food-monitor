# Streamlit configuration for MealFlow360
# Base theme; light/dark/warm variants are applied by utils/theme.py.
# Theme gives the app a clean, modern dashboard look.

[theme]
base = "light"
primaryColor = "#1B8A5A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F5"
textColor = "#1B2A22"
font = "sans serif"

[browser]
gatherUsageStats = false
